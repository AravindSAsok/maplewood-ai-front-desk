
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maplewood-ai-front-desk"
version = "0.1.0"
description = "Safety-first AI front-desk agent prototype for a synthetic clinic inbox"
requires-python = ">=3.10"
dependencies = ["mcp>=1.28.0,<2.0.0"]

[project.optional-dependencies]
llm = ["openai>=2.0.0"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["maplewood_agent*"]
exclude = ["data*", "reports*", "tests*"]
